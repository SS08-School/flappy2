<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4ec0ca">
  <meta name="description" content="Flappy Bird fangame. Play, save your scores, and view the weekly leaderboard.">
  <title>Flabby Bird</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/game.js"></script>
</head>
<body>
  <main id="game-frame" aria-label="Flabby Bird game">
    <canvas id="game" tabindex="0" aria-label="Press Space, Up, or tap to flap. P or Escape opens the menu."></canvas>
    <div id="game-ui">
      <button id="menu-button" class="sprite-button" aria-label="Game menu"><canvas data-sprite="menu" width="80" height="28" aria-hidden="true"></canvas></button>
      <div id="health" hidden aria-live="polite">LIVES <span id="health-value">2</span></div>
      <div id="home-buttons" class="game-buttons">
        <button id="play-button" class="sprite-button" aria-label="Play"><canvas data-sprite="play" width="104" height="58" aria-hidden="true"></canvas></button>
        <button class="sprite-button" data-page="leaderboard" aria-label="Leaderboard"><canvas data-sprite="leaderboard" width="104" height="58" aria-hidden="true"></canvas></button>
      </div>
      <div id="over-buttons" class="game-buttons" hidden>
        <button id="retry-button" class="sprite-button" aria-label="Play again"><canvas data-sprite="play" width="104" height="58" aria-hidden="true"></canvas></button>
        <button class="sprite-button" data-page="leaderboard" aria-label="Leaderboard"><canvas data-sprite="leaderboard" width="104" height="58" aria-hidden="true"></canvas></button>
      </div>
      <p id="save-status" role="status" hidden></p>
      <p id="power-status" role="status" hidden></p>
      <p id="loading-status" role="status">LOADING...</p>
      <section id="menu-overlay" hidden>
        <div id="menu-panel" role="dialog" aria-modal="true" aria-labelledby="menu-title" tabindex="-1">
          <canvas id="panel-background" aria-hidden="true"></canvas>
          <div class="panel-body">
            <div class="panel-header"><h1 id="menu-title">MENU</h1><button id="close-menu" class="pixel-button close-button" aria-label="Close menu"><canvas aria-hidden="true"></canvas><span>OK</span></button></div>
            <div id="menu-content"></div>
          </div>
        </div>
      </section>
      <p id="toast" role="status" hidden></p>
      <span id="score-announcement" class="sr-only" aria-live="off">Score 0</span>
    </div>
  </main>
</body>
</html>
