<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4ec0ca">
  <meta name="description" content="Flappy Bird adapted for widescreen using the official sprite sheet.">
  <title>Flappy Bird</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/game.js"></script>
</head>
<body class="aspect-locked">
  <main id="game-frame" aria-label="Flappy Bird">
    <canvas id="game" tabindex="0" aria-label="Press Space, Up, or tap to flap. Escape returns to the title screen."></canvas>
    <div id="game-ui">
      <button id="menu-button" class="sprite-button" aria-label="Return to title screen" hidden><canvas data-sprite="menu" width="80" height="28" aria-hidden="true"></canvas></button>
      <div id="play-controls" hidden><button id="play-button" class="sprite-button" aria-label="Play"><canvas data-sprite="play" width="116" height="70" aria-hidden="true"></canvas></button></div>
    </div>
  </main>
</body>
</html>
