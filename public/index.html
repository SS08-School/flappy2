<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4ec0ca">
  <meta name="description" content="A responsive recreation of Flappy Bird v1.3 using the uploaded official sprites and supplied sounds.">
  <title>Flappy Bird</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/game.js"></script>
</head>
<body>
  <main id="game-frame" aria-label="Flappy Bird">
    <canvas id="game" tabindex="-1" aria-label="Press Space, W, Up, or tap anywhere, including the black bars, to flap."></canvas>
    <div id="game-ui">
      <button id="rate-button" class="sprite-button" aria-label="Rate (display only)" disabled hidden><canvas data-sprite="rate" width="74" height="48" aria-hidden="true"></canvas></button>
      <div id="play-controls" hidden>
        <button id="play-button" class="sprite-button" tabindex="-1" aria-label="Play"><canvas data-sprite="play" width="116" height="70" aria-hidden="true"></canvas></button>
        <button class="sprite-button" aria-label="Leaderboard (display only)" disabled><canvas data-sprite="leaderboard" width="116" height="70" aria-hidden="true"></canvas></button>
      </div>
    </div>
  </main>
</body>
</html>
